<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5ef5"/><stop offset="1" stop-color="#a64be0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <g transform="translate(256 256)">
    <rect x="-150" y="-150" width="300" height="300" rx="56" fill="#fff" opacity=".14"/>
    <line x1="0" y1="-128" x2="0" y2="128" stroke="#fff" stroke-opacity=".25" stroke-width="6" stroke-linecap="round"/>
    <line x1="-128" y1="0" x2="128" y2="0" stroke="#fff" stroke-opacity=".25" stroke-width="6" stroke-linecap="round"/>
    <!-- plus -->
    <g transform="translate(-75 -75)" stroke="#fff" stroke-width="22" stroke-linecap="round"><line x1="-36" y1="0" x2="36" y2="0"/><line x1="0" y1="-36" x2="0" y2="36"/></g>
    <!-- minus -->
    <g transform="translate(75 -75)" stroke="#fff" stroke-width="22" stroke-linecap="round"><line x1="-36" y1="0" x2="36" y2="0"/></g>
    <!-- times (gold) -->
    <g transform="translate(-75 75) rotate(45)" stroke="#ffc53d" stroke-width="22" stroke-linecap="round"><line x1="-36" y1="0" x2="36" y2="0"/><line x1="0" y1="-36" x2="0" y2="36"/></g>
    <!-- divide -->
    <g transform="translate(75 75)" fill="#fff"><rect x="-36" y="-11" width="72" height="22" rx="11"/><circle cx="0" cy="-36" r="13"/><circle cx="0" cy="36" r="13"/></g>
  </g>
</svg>
