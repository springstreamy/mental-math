<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mental Math Arena</title>
<meta name="description" content="Mental math training for kids: levels, sprints, high scores and badges.">
<meta name="theme-color" content="#5b5cf0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math Arena">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3ff; --bg2:#fdf1ff; --card:#ffffff; --ink:#1d2340; --muted:#6b7194; --line:#e3e7f5;
  --primary:#5b5cf0; --primary-ink:#fff; --good:#1fb36b; --bad:#ef4b5f; --gold:#ffb703; --lock:#c9cde0;
  --shadow:0 6px 20px rgba(40,50,120,.10); --radius:20px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Rubik,system-ui,"Segoe UI",Arial,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.math{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 40px}

/* header */
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 14px}
.brand{font-weight:800;font-size:1.35rem;display:flex;align-items:center;gap:8px;margin-inline-end:auto;cursor:pointer}
.brand .logo{width:38px;height:38px;border-radius:12px;display:block}
#btnInstall{display:none;background:var(--primary);color:#fff}
#btnInstall.on{display:flex}
.hbtn{background:var(--card);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);font-weight:500;font-size:.95rem;display:flex;align-items:center;gap:6px}
.hbtn:hover{transform:translateY(-1px)}
.chip{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:5px 14px 5px 5px;box-shadow:var(--shadow);cursor:pointer}
[dir=rtl] .chip{padding:5px 5px 5px 14px}
.avatar{width:36px;height:36px;border-radius:50%;background:#eef0ff;display:grid;place-items:center;font-size:1.3rem;flex:none}
.chip .nm{font-weight:700;line-height:1.1}
.chip .rk{font-size:.75rem;color:var(--muted)}
.xpbar{height:5px;border-radius:9px;background:var(--line);margin-top:3px;overflow:hidden;width:90px}
.xpbar i{display:block;height:100%;background:var(--gold)}

.screen{display:none;animation:fade .25s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:1.7rem;margin:6px 0 14px}
h2{font-size:1.2rem;margin:22px 0 10px}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}

/* profiles */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.pcard{position:relative;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 12px;text-align:center;cursor:pointer;transition:transform .15s}
.pcard:hover{transform:translateY(-3px)}
.pcard .avatar{width:64px;height:64px;font-size:2.2rem;margin:0 auto 8px}
.pcard .nm{font-weight:700;font-size:1.1rem}
.pcard .del{position:absolute;top:6px;inset-inline-end:8px;color:var(--muted);font-size:1rem;padding:4px 7px;border-radius:8px}
.pcard .del:hover{background:#ffe9ec;color:var(--bad)}
.pcard.add{border:3px dashed var(--line);box-shadow:none;background:transparent;display:grid;place-items:center;min-height:150px;color:var(--muted);font-weight:700}
.newp{display:none;margin-top:16px}
.newp.on{display:block}
.newp input{width:100%;font:inherit;font-size:1.2rem;padding:12px 14px;border-radius:14px;border:2px solid var(--line);margin:6px 0 12px}
.avpick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.avpick button{width:48px;height:48px;border-radius:14px;font-size:1.6rem;background:#f3f4fb}
.avpick button.sel{background:var(--primary);box-shadow:0 0 0 3px #c9caff}
.btn{background:var(--primary);color:var(--primary-ink);border-radius:16px;padding:13px 22px;font-weight:700;font-size:1.05rem;box-shadow:0 4px 0 #3f40b8;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3f40b8}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.good{background:var(--good);box-shadow:0 4px 0 #148a50}
.btn:disabled{opacity:.45;cursor:default}

/* topics */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;text-align:start;display:flex;flex-direction:column;gap:6px;transition:transform .15s;border-top:6px solid var(--c)}
.tcard:hover{transform:translateY(-3px)}
.tcard .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;font-weight:800;background:color-mix(in srgb,var(--c) 16%,white);color:var(--c)}
.tcard .tn{font-weight:700;font-size:1.1rem}
.tcard .td{font-size:.85rem;color:var(--muted);min-height:2.4em}
.tcard .meta{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;margin-top:4px}
.lvpill{background:color-mix(in srgb,var(--c) 14%,white);color:var(--c);font-weight:700;border-radius:999px;padding:3px 10px}
.stars{color:var(--gold);letter-spacing:1px}
.stars .off{color:var(--lock)}

/* topic detail */
.thead{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
.thead .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:1.9rem;font-weight:800;background:color-mix(in srgb,var(--c) 16%,white);color:var(--c)}
.thead h1{margin:0}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lv{background:var(--card);border-radius:16px;padding:10px 4px;box-shadow:var(--shadow);text-align:center;border:3px solid transparent}
.lv b{display:block;font-size:1.4rem}
.lv .stars{font-size:.8rem}
.lv.sel{border-color:var(--c)}
.lv.locked{background:#f1f2f8;color:var(--lock);box-shadow:none;cursor:not-allowed}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px}
.mode{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;text-align:start;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.mode:hover{transform:translateY(-3px)}
.mode .mt{font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:8px}
.mode .md{color:var(--muted);font-size:.9rem}
.mode .mb{margin-top:6px;font-weight:700;color:var(--c)}
.statline{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;margin-top:14px}

/* game */
.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.gbar .sp{margin-inline-end:auto;font-weight:700}
.pill{background:var(--card);border-radius:999px;padding:7px 14px;box-shadow:var(--shadow);font-weight:700;display:flex;gap:6px;align-items:center}
.prog{height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--c,var(--primary));transition:width .2s linear}
.qcard{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:28px 16px 22px;text-align:center;position:relative;overflow:hidden}
.qcard.ok{animation:okp .4s}
.qcard.no{animation:shake .4s}
@keyframes okp{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--good) 40%,transparent)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.qlabel{color:var(--muted);font-weight:500;margin-bottom:6px;min-height:1.3em}
.qtext{font-size:clamp(2.1rem,8.5vw,4.2rem);font-weight:800;line-height:1.2;min-height:1.3em}
.qtext.words{font-size:clamp(1.6rem,6vw,2.8rem)}
.blank{display:inline-block;min-width:1.4em;border-bottom:5px solid var(--c,var(--primary));color:var(--c,var(--primary))}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.62em;line-height:1;text-align:center;margin:0 .1em}
.frac span:first-child{border-bottom:3px solid currentColor;padding:0 .1em .05em}
.frac span:last-child{padding-top:.05em}
.ans{margin:16px auto 0;min-height:68px;max-width:300px;border-radius:18px;background:#f3f4fb;font-size:2.4rem;font-weight:800;display:grid;place-items:center;direction:ltr}
.ans.empty{color:var(--lock)}
.fb{min-height:64px;margin-top:12px;font-weight:700;font-size:1.15rem}
.fb.good{color:var(--good)}
.fb.bad{color:var(--bad)}
.fb .ex{display:block;font-weight:500;font-size:1rem;color:var(--ink);margin-top:6px;background:#fff7e6;border-radius:12px;padding:8px 12px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:380px;margin:16px auto 0;direction:ltr}
.keypad button{background:var(--card);border-radius:18px;padding:16px 0;font-size:1.7rem;font-weight:700;box-shadow:0 4px 0 var(--line)}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.keypad .go{background:var(--good);color:#fff;box-shadow:0 4px 0 #148a50}
.keypad .bk{color:var(--muted)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:420px;margin:18px auto 0}
.yn button{border-radius:20px;padding:22px 0;font-size:1.6rem;font-weight:800;color:#fff}
.yn .y{background:var(--good);box-shadow:0 5px 0 #148a50}
.yn .n{background:var(--bad);box-shadow:0 5px 0 #b8293a}
.yn button:active{transform:translateY(4px);box-shadow:none}
.controw{text-align:center;margin-top:12px;display:none}
.controw.on{display:block}
.keyhint{text-align:center;color:var(--muted);font-size:.8rem;margin-top:10px}

/* results */
.res{text-align:center}
.bigstars{font-size:3.4rem;letter-spacing:6px;color:var(--gold)}
.bigstars .off{color:var(--lock)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0}
.rgrid div{background:#f5f6fc;border-radius:16px;padding:12px}
.rgrid b{display:block;font-size:1.6rem}
.banner{border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:700}
.banner.gold{background:#fff4d1;color:#9a6a00}
.banner.green{background:#dcf8ea;color:#11804b}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.mist{text-align:start;margin-top:18px}
.mist li{margin:5px 0}
.mist .yours{color:var(--bad);text-decoration:line-through;margin-inline-start:8px}

/* scores */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;box-shadow:var(--shadow)}
.tabs button.on{background:var(--primary);color:#fff}
select{font:inherit;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
table{width:100%;border-collapse:collapse}
td,th{padding:9px 6px;text-align:start;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:.85rem}
tr.me td{background:#f0f0ff}
.medal{font-size:1.2rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);text-align:center}
.badge .bi{font-size:2rem}
.badge .bn{font-weight:700}
.badge .bd{font-size:.8rem;color:var(--muted)}
.badge.off{opacity:.38;filter:grayscale(1)}

/* rules */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rule{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.rule .rn{font-weight:800;font-size:1.15rem;color:var(--primary)}
.rule .rx{color:var(--muted);font-size:.9rem;margin-top:6px}

.arr{display:inline-block}
[dir=rtl] .arr{transform:scaleX(-1)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;transition:transform .3s;z-index:9}
.toast.on{transform:translateX(-50%)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:8;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

@media (max-width:560px){
  .levels{grid-template-columns:repeat(5,1fr);gap:6px}
  .lv b{font-size:1.15rem}
  .keypad button{padding:13px 0}
  .chip .rk,.xpbar{display:none}
  .hbtn .lbl{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" id="brand"><img class="logo" src="icon.svg" alt=""><span data-t="title"></span></div>
    <button class="hbtn" id="btnInstall">📲 <span class="lbl" data-t="install"></span></button>
    <button class="hbtn" id="btnScores">🏆 <span class="lbl" data-t="scores"></span></button>
    <button class="hbtn" id="btnRules">💡 <span class="lbl" data-t="rules"></span></button>
    <button class="hbtn" id="btnSound" aria-label="sound">🔊</button>
    <button class="hbtn" id="btnLang">עב</button>
    <div class="chip" id="chip" style="display:none"></div>
  </header>

  <!-- PROFILES -->
  <section class="screen" id="s-profiles">
    <h1 data-t="whoPlaying"></h1>
    <div class="players" id="playerList"></div>
    <div class="card newp" id="newPlayer">
      <label for="pname" class="muted" data-t="yourName"></label>
      <input id="pname" maxlength="16" autocomplete="off">
      <div class="muted" data-t="pickAvatar" style="margin-bottom:6px"></div>
      <div class="avpick" id="avpick"></div>
      <button class="btn" id="createBtn" data-t="letsGo"></button>
    </div>
  </section>

  <!-- HOME -->
  <section class="screen" id="s-home">
    <h1 data-t="chooseTopic"></h1>
    <div class="topics" id="topicList"></div>
  </section>

  <!-- TOPIC -->
  <section class="screen" id="s-topic">
    <button class="hbtn" data-go="home"><span class="arr">←</span> <span data-t="topics"></span></button>
    <div class="thead" id="topicHead"></div>
    <h2 data-t="levels"></h2>
    <div class="levels" id="levelGrid"></div>
    <div class="modes" id="modeList"></div>
    <div class="statline" id="topicStats"></div>
  </section>

  <!-- GAME -->
  <section class="screen" id="s-game">
    <div class="gbar">
      <span class="sp" id="gTitle"></span>
      <span class="pill" id="gStatus"></span>
      <span class="pill" id="gStreak">🔥 0</span>
      <span class="pill" id="gScore"></span>
      <button class="hbtn" id="quitBtn">✕ <span class="lbl" data-t="quit"></span></button>
    </div>
    <div class="prog"><i id="gProg"></i></div>
    <div class="qcard" id="qcard">
      <div class="qlabel" id="qLabel"></div>
      <div class="qtext" id="qText"></div>
      <div class="ans" id="ansBox"></div>
      <div class="fb" id="fb"></div>
    </div>
    <div class="keypad" id="keypad"></div>
    <div class="yn" id="yn">
      <button class="y" data-yn="1" data-t="yes"></button>
      <button class="n" data-yn="0" data-t="no"></button>
    </div>
    <div class="controw" id="contRow"><button class="btn" id="contBtn" data-t="continue"></button></div>
    <div class="keyhint" id="keyhint"></div>
  </section>

  <!-- RESULTS -->
  <section class="screen" id="s-results">
    <div class="card res" id="resCard"></div>
  </section>

  <!-- SCORES -->
  <section class="screen" id="s-scores">
    <h1 data-t="scores"></h1>
    <div class="tabs" id="scoreTabs"></div>
    <div class="card" id="scoreBody"></div>
  </section>

  <!-- RULES -->
  <section class="screen" id="s-rules">
    <h1 data-t="rules"></h1>
    <div id="rulesBody"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= utilities ================= */
const $ = s => document.querySelector(s);
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const M = s => `<span class="math">${s}</span>`;
const BL = '<span class="blank">?</span>';
const frac = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lang = 'en';
const tr = (en, he) => lang === 'he' ? he : en;

/* ================= storage ================= */
const KEY = 'mentalMathArena.v1';
let db;
try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!db || !db.players) db = { players: {}, current: null, lang: 'en', sound: true, scores: [] };
lang = db.lang || 'en';
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
const P = () => db.players[db.current];
function topicData(p, id) {
  return p.topics[id] || (p.topics[id] = { unlocked: 1, stars: {}, answered: 0, correct: 0, best: {} });
}

/* ================= strings ================= */
const STR = {
  title: ['Mental Math Arena', 'זירת חשבון בעל פה'],
  scores: ['High Scores', 'טבלת שיאים'],
  rules: ['Tips & Rules', 'טיפים וכללים'],
  whoPlaying: ["Who's playing?", 'מי משחק?'],
  newPlayer: ['New player', 'שחקן חדש'],
  yourName: ['Your name', 'השם שלך'],
  pickAvatar: ['Pick an avatar', 'בחרו דמות'],
  letsGo: ["Let's go!", 'יאללה!'],
  chooseTopic: ['Choose a topic', 'בחרו נושא'],
  topics: ['Topics', 'נושאים'],
  levels: ['Levels', 'שלבים'],
  level: ['Level', 'שלב'],
  practice: ['Practice', 'אימון'],
  practiceD: ['10 questions. Get 8 right to unlock the next level.', '10 שאלות. 8 תשובות נכונות פותחות את השלב הבא.'],
  sprint: ['Sprint', 'ספרינט'],
  sprintD: ['60 seconds. Answer as many as you can!', '60 שניות. כמה שיותר תשובות נכונות!'],
  survival: ['Survival', 'הישרדות'],
  survivalD: ['3 lives. It gets harder as you go.', '3 לבבות. נהיה קשה יותר ויותר.'],
  best: ['Best', 'שיא'],
  yes: ['Yes', 'כן'], no: ['No', 'לא'],
  continue: ['Continue', 'המשך'],
  quit: ['Quit', 'יציאה'],
  answerIs: ['The answer is', 'התשובה היא'],
  roundDone: ['Round complete!', 'סיימת סבב!'],
  timeUp: ["Time's up!", 'נגמר הזמן!'],
  gameOver: ['Game over', 'המשחק נגמר'],
  score: ['Score', 'ניקוד'],
  correct: ['Correct', 'נכונות'],
  accuracy: ['Accuracy', 'דיוק'],
  bestStreak: ['Best streak', 'רצף שיא'],
  xpGained: ['XP earned', 'נקודות ניסיון'],
  newBest: ['New personal best!', 'שיא אישי חדש!'],
  topScore: ['#1 on the leaderboard!', 'מקום ראשון בטבלה!'],
  unlocked: ['Level {n} unlocked!', 'שלב {n} נפתח!'],
  again: ['Play again', 'שוב'],
  nextLevel: ['Next level', 'לשלב הבא'],
  mistakes: ['Let\'s review', 'בואו נחזור על'],
  newBadge: ['New badge', 'תג חדש'],
  badges: ['Badges', 'תגים'],
  players: ['Players', 'שחקנים'],
  player: ['Player', 'שחקן'],
  date: ['Date', 'תאריך'],
  noScores: ['No scores yet. Be the first!', 'עדיין אין שיאים. היו הראשונים!'],
  delConfirm: ['Delete {name} and all their progress?', 'למחוק את {name} ואת כל ההתקדמות?'],
  questions: ['questions', 'שאלות'],
  keyhintNum: ['Type the answer and press Enter', 'הקלידו תשובה ולחצו Enter'],
  keyhintYN: ['Keys: Y = yes, N = no', 'מקשים: 1 = כן, 2 = לא'],
  survStart: ['starts at level 1', 'מתחיל משלב 1'],
  question: ['Question', 'שאלה'],
  divisRules: ['Divisibility rules', 'סימני התחלקות'],

function mulTrick() {
  const k = pick([11, 25, 99, 50, 15]);
  let n, ex;
  if (k === 11) { n = R(12, 81); const [x, y] = String(n).split('').map(Number);
    ex = tr('×11: split the digits and put their sum in the middle: ', '×11: מפרידים את הספרות ושמים את הסכום שלהן באמצע: ') + M(`${x} + ${y} = ${x + y} → ${x}(${x + y})${y} = ${n * 11}`) + (x + y > 9 ? tr(' (carry the 1)', ' (עם העברה)') : ''); }
  else if (k === 25) { n = 4 * R(2, 30) + (Math.random() < .3 ? R(1, 3) : 0);

}
function divExplain(n, d) {
  const s = String(n), ds = s.split('').map(Number), sum = ds.reduce((x, y) => x + y, 0);
  const yes = n % d === 0, Y = yes ? tr('YES', 'כן') : tr('NO', 'לא'), arrow = tr(' → ', ' ← ');
  const is = ok => ok ? tr('is', '') : tr('is not', 'לא ');
  const part = k => {
    const ok = n % k === 0;
    switch (k) {
      case 2: return tr(`last digit ${s.at(-1)} is ${ok ? 'even' : 'odd'}`, `הספרה האחרונה ${s.at(-1)} ${ok ? 'זוגית' : 'אי-זוגית'}`);
      case 5: return tr(`last digit ${s.at(-1)} ${ok ? 'is' : 'is not'} 0 or 5`, `הספרה האחרונה ${s.at(-1)} ${ok ? 'היא' : 'אינה'} 0 או 5`);
      case 10: return tr(`last digit ${ok ? 'is' : 'is not'} 0`, `הספרה האחרונה ${ok ? 'היא' : 'אינה'} 0`);
      case 3: case 9: return tr(`digit sum `, `סכום הספרות `) + M(`${ds.join('+')} = ${sum}`) + tr(` ${is(ok)} divisible by ${k}`, ` ${is(ok)}מתחלק ב-${k}`);
      case 4: case 8: { const m = k === 4 ? 100 : 1000, last = n % m;
        return tr(`last ${k === 4 ? 'two' : 'three'} digits `, `${k === 4 ? 'שתי' : 'שלוש'} הספרות האחרונות `) + M(String(last)) + tr(` ${ok ? 'are' : 'are not'} divisible by ${k}`, ` ${is(ok)}מתחלקות ב-${k}`); }
      case 11: { let expr = '' + ds[0], alt = ds[0];
        for (let i = 1; i < ds.length; i++) { expr += (i % 2 ? ' − ' : ' + ') + ds[i]; alt += i % 2 ? -ds[i] : ds[i]; }
        return tr('alternating sum ', 'סכום לסירוגין ') + M(`${expr} = ${alt}`) + tr(` ${is(ok)} divisible by 11`, ` ${is(ok)}מתחלק ב-11`); }
    }
  };
  const combo = { 6: [2, 3], 12: [3, 4], 15: [3, 5] }[d];
  if (combo) return tr(`Divisible by ${d} = by ${combo[0]} AND by ${combo[1]}: `, `מתחלק ב-${d} = מתחלק ב-${combo[0]} וגם ב-${combo[1]}: `) + combo.map(part).join('; ') + arrow + Y;
  return part(d).replace(/^./, c => c.toUpperCase()) + arrow + Y;
}

let actx;
function beep(notes) {
  if (!db.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let tm = actx.currentTime;
    for (const [f, d, type] of notes) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.18, tm); g.gain.exponentialRampToValueAtTime(.001, tm + d);
      o.connect(g).connect(actx.destination); o.start(tm); o.stop(tm + d); tm += d * .8;
    }
  } catch (e) {}
}

/* ================= game ================= */
function startGame(mode, level) {
  clearInterval(G && G.timer);
  const d = topicData(P(), curTopic);
  G = { topic: curTopic, mode, level: mode === 'sprint' ? d.unlocked : (level || selLevel), n: 0, correct: 0, streak: 0, bestStreak: 0,
    lives: 3, score: 0, xp: 0, mistakes: [], input: '', state: 'ask', lastText: '' };
  $('#s-game').style.setProperty('--c', TBY[curTopic].c);
  $('#gTitle').textContent = tname(TBY[curTopic]);
  show('game');
  if (mode === 'sprint') {
    G.end = Date.now() + 60000;
    G.timer = setInterval(() => { if (Date.now() >= G.end) finish('time'); else renderStatus(); }, 100);
  }
  nextQ();
}
function nextQ() {
  G.curLevel = G.mode === 'survival' ? Math.min(10, 1 + Math.floor(G.correct / 4)) : G.level;
  let qq, tries = 0;
  do qq = GEN[G.topic](G.curLevel); while (qq.text === G.lastText && ++tries < 30);
  G.q = qq; G.lastText = qq.text; G.input = ''; G.state = 'ask'; G.qStart = performance.now();
  $('#qText').innerHTML = qq.text;
  $('#qText').classList.toggle('words', !!qq.words);
  $('#qLabel').textContent = qq.label || (G.mode === 'survival' ? `${t('level')} ${G.curLevel}` : '');
  $('#fb').className = 'fb'; $('#fb').innerHTML = '';
  $('#qcard').className = 'qcard';
  const yn = qq.kind === 'yn';
  $('#ansBox').style.display = yn ? 'none' : '';
  $('#keypad').style.display = yn ? 'none' : '';
  $('#yn').style.display = yn ? '' : 'none';
  $('#keyhint').textContent = t(yn ? 'keyhintYN' : 'keyhintNum');
  $('#contRow').classList.remove('on');
  renderAns(); renderStatus();
}
function renderAns() {
  const b = $('#ansBox');
  b.textContent = G.input || '?';
  b.classList.toggle('empty', !G.input);
}
function renderStatus() {
  if (!G) return;
  let st, pct;
  if (G.mode === 'practice') { st = `${t('question')} ${Math.min(G.n + 1, 10)}/10`; pct = G.n * 10; }
  else if (G.mode === 'sprint') { const s = Math.max(0, (G.end - Date.now()) / 1000); st = `⏱ ${Math.ceil(s)}`; pct = s / 60 * 100; }
  else { st = '❤️'.repeat(G.lives) + '🤍'.repeat(3 - G.lives); pct = (G.correct % 4) * 25; }
  $('#gStatus').textContent = st;
  $('#gProg').style.width = pct + '%';
  $('#gStreak').textContent = '🔥 ' + G.streak;
  $('#gScore').textContent = G.mode === 'practice' ? `⭐ ${G.score}` : `✔ ${G.correct}`;
}
function typeKey(k) {
  if (!G || G.state !== 'ask' || G.q.kind !== 'num') return;
  if (k === 'back') G.input = G.input.slice(0, -1);
  else if (G.input.length < 7) G.input = (G.input === '0' ? '' : G.input) + k;
  renderAns();
}
function submit(val) {
  if (!G || G.state !== 'ask') return;
  const qq = G.q;
  let given;
  if (qq.kind === 'yn') given = val;
  else { if (G.input === '') return; given = +G.input; }
  const ok = given === qq.answer, dt = (performance.now() - G.qStart) / 1000;
  const td = topicData(P(), G.topic);
  td.answered++; G.n++;
  if (ok) {
    td.correct++; G.correct++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
    const pts = 10 + 2 * G.curLevel + (dt < 3 ? 5 : dt < 6 ? 2 : 0);
    G.score += pts; G.xp += pts;
    G.state = 'pause';
    $('#qcard').classList.add('ok');
    const pr = pick(PRAISE);
    $('#fb').className = 'fb good'; $('#fb').textContent = `${lang === 'he' ? pr[1] : pr[0]}${G.streak >= 5 ? ' 🔥' + G.streak : ''}`;
    SND.ok(); renderStatus();
    setTimeout(advance, 550);
  } else {
    G.streak = 0;
    if (G.mode === 'survival') G.lives--;
    G.mistakes.push({ text: qq.text, answer: ansText(qq), given: qq.kind === 'yn' ? (given ? t('yes') : t('no')) : given });
    G.state = 'wrong';
    $('#qcard').classList.add('no');
    $('#fb').className = 'fb bad';
    $('#fb').innerHTML = `${t('answerIs')} ${M(ansText(qq))}` + (qq.explain ? `<span class="ex">💡 ${qq.explain}</span>` : '');
    SND.bad(); renderStatus();
    $('#contRow').classList.add('on');
    if (G.mode === 'sprint') { const g = G; setTimeout(() => { if (G === g && g.state === 'wrong') cont(); }, qq.explain ? 2200 : 1300); }
  }
}
const ansText = qq => qq.kind === 'yn' ? (qq.answer ? t('yes') : t('no')) : qq.answer;
function cont() { if (G && G.state === 'wrong') advance(); }
function advance() {
  if (!G || G.state === 'over') return;
  if ((G.mode === 'practice' && G.n >= 10) || (G.mode === 'survival' && G.lives <= 0)) return finish();
  nextQ();
}
function quitGame() {
  if (G) { clearInterval(G.timer); G.state = 'over'; G = null; save(); }
  show('topic');
}

/* ================= results ================= */
function finish(reason) {
  if (!G || G.state === 'over') return;
  clearInterval(G.timer); G.state = 'over';
  const p = P(), d = topicData(p, G.topic);
  const r = { mode: G.mode, correct: G.correct, n: G.n, bestStreak: G.bestStreak, xp: G.xp, level: G.level, banners: [] };
  let stars = 0;
  if (G.mode === 'practice') {
    stars = G.correct >= 10 ? 3 : G.correct >= 8 ? 2 : G.correct >= 6 ? 1 : 0;
    d.stars[G.level] = Math.max(d.stars[G.level] || 0, stars);
    if (stars >= 2 && G.level === d.unlocked && d.unlocked < 10) {
      d.unlocked++; r.banners.push(['green', '🔓 ' + t('unlocked', { n: d.unlocked })]);
    }
  } else {
    const prev = d.best[G.mode] || 0;
    if (G.correct > prev) { d.best[G.mode] = G.correct; if (prev > 0) r.banners.push(['gold', '🏅 ' + t('newBest')]); }
    if (G.correct > 0) {
      const top = db.scores.filter(s => s.topic === G.topic && s.mode === G.mode).reduce((m, s) => Math.max(m, s.score), 0);
      if (G.correct > top && top > 0) r.banners.push(['gold', '🥇 ' + t('topScore')]);
      db.scores.push({ name: p.name, topic: G.topic, mode: G.mode, score: G.correct, date: Date.now() });
      pruneScores(G.topic, G.mode);
    }
  }
  p.xp += G.xp; p.rounds++; p.bestStreak = Math.max(p.bestStreak, G.bestStreak);
  const newB = BADGES.filter(b => !p.badges.includes(b.id) && b.test(p, r));
  newB.forEach(b => { p.badges.push(b.id); r.banners.push(['gold', `${b.i} ${t('newBadge')}: ${lang === 'he' ? b.he : b.en}`]); });
  save();

  const title = G.mode === 'practice' ? t('roundDone') : G.mode === 'sprint' ? t('timeUp') : t('gameOver');
  const acc = G.n ? Math.round(G.correct / G.n * 100) : 0;
  const canNext = G.mode === 'practice' && G.level < d.unlocked;
  $('#resCard').innerHTML = `
    <h1>${title}</h1>
    ${G.mode === 'practice' ? `<div class="bigstars">${starStr(stars)}</div>` : `<div style="font-size:3.4rem;font-weight:800">${G.correct}</div><div class="muted">${t('correct')}</div>`}
    ${r.banners.map(([c, s]) => `<div class="banner ${c}">${s}</div>`).join('')}
    <div class="rgrid">
      <div><b>${G.correct}/${G.n}</b>${t('correct')}</div>
      <div><b>${acc}%</b>${t('accuracy')}</div>
      <div><b>${G.bestStreak}</b>${t('bestStreak')}</div>
      <div><b>+${G.xp}</b>${t('xpGained')}</div>
    </div>
    <div class="rbtns">
      ${canNext ? `<button class="btn good" id="rNext">${t('nextLevel')} <span class="arr">→</span></button>` : ''}
      <button class="btn" id="rAgain">↻ ${t('again')}</button>
      <button class="btn ghost" data-go="topic">${tname(TBY[G.topic])}</button>
    </div>
    ${G.mistakes.length ? `<div class="mist"><h2>📝 ${t('mistakes')}</h2><ul>${G.mistakes.slice(0, 12).map(m =>
      `<li>${m.text} = <b>${M(m.answer)}</b><span class="yours">${M(esc(m.given))}</span></li>`).join('')}</ul></div>` : ''}`;
  const lastMode = G.mode, lastLevel = G.level;
  $('#rAgain').onclick = () => startGame(lastMode, lastLevel);
  if (canNext) $('#rNext').onclick = () => { selLevel = lastLevel + 1; startGame('practice', lastLevel + 1); };
  show('results');
  if (stars === 3 || r.banners.length) { SND.win(); confetti(); }
}
function pruneScores(topic, mode) {
  const these = db.scores.filter(s => s.topic === topic && s.mode === mode).sort((a, b) => b.score - a.score);
  const drop = new Set(these.slice(20));
  db.scores = db.scores.filter(s => !drop.has(s));
}
function confetti() {
  const cols = ['#ffb703', '#5b5cf0', '#1fb36b', '#ef4b5f', '#2d9cdb', '#e056a0'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = pick(cols);
    el.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    el.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3800);
  }
}

    ['( )', 'Brackets → × ÷ (left to right) → + − (left to right)', 'סוגריים ← כפל וחילוק ← חיבור וחיסור', '2 + 3 × 4 = 14'],

      db.scores = db.scores.filter(s => s.name !== ds.del);
      if (db.current === ds.del) db.current = null;
      save(); renderProfiles();
    }
    return;
  }
  if (ds.p !== undefined) return selectPlayer(ds.p);
  if (el.id === 'addP') { $('#newPlayer').classList.add('on'); $('#pname').focus(); return; }
  if (ds.av) { newAv = ds.av; document.querySelectorAll('#avpick button').forEach(b => b.classList.toggle('sel', b === el)); return; }
  if (ds.topic) return openTopic(ds.topic);
  if (ds.lv) { selLevel = +ds.lv; return renderTopic(); }
  if (ds.mode) return startGame(ds.mode);
  if (ds.k) return ds.k === 'go' ? submit() : typeKey(ds.k);
  if (ds.yn) return submit(ds.yn === '1');
  if (ds.tab) { scoreTab.view = ds.tab; return renderScores(); }
  if (ds.go) return show(ds.go === 'topic' && !curTopic ? 'home' : ds.go);
});
$('#createBtn').onclick = createPlayer;
$('#pname').addEventListener('keydown', e => { if (e.key === 'Enter') createPlayer(); });
$('#contBtn').onclick = cont;
$('#quitBtn').onclick = quitGame;
$('#brand').onclick = () => { if (G && G.state !== 'over') quitGame(); show(db.current ? 'home' : 'profiles'); };
$('#chip').onclick = () => { if (G && G.state !== 'over') quitGame(); show('profiles'); };
$('#btnScores').onclick = () => { if (G && G.state !== 'over') quitGame(); if (db.current) show('scores'); };
$('#btnRules').onclick = () => { if (G && G.state !== 'over') quitGame(); show('rules'); };
$('#btnSound').onclick = () => { db.sound = !db.sound; save(); applyLang(); };
$('#btnLang').onclick = () => {
  lang = db.lang = lang === 'he' ? 'en' : 'he'; save(); applyLang();
  const cur = document.querySelector('.screen.on');
  if (cur && cur.id !== 's-game' && cur.id !== 's-results') show(cur.id.slice(2));
  else if (G && G.state === 'ask') { const kind = G.q.kind; $('#keyhint').textContent = t(kind === 'yn' ? 'keyhintYN' : 'keyhintNum'); }
};
document.addEventListener('keydown', e => {
  if (!$('#s-game').classList.contains('on') || !G) return;
  if (e.target.tagName === 'INPUT') return;
  if (G.state === 'wrong' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return cont(); }
  if (G.state !== 'ask') return;
  if (G.q.kind === 'yn') {
    if (e.code === 'KeyY' || e.key === '1') submit(true);
    else if (e.code === 'KeyN' || e.key === '2') submit(false);
    return;
  }
  if (/^[0-9]$/.test(e.key)) typeKey(e.key);
  else if (e.key === 'Backspace') { e.preventDefault(); typeKey('back'); }
  else if (e.key === 'Enter') { e.preventDefault(); submit(); }
  else if (e.key === 'Escape') quitGame();
});

/* install as an app */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#btnInstall').classList.add('on'); });
window.addEventListener('appinstalled', () => { installEvt = null; $('#btnInstall').classList.remove('on'); });
$('#btnInstall').onclick = async () => {
  if (!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice.catch(() => {});
  installEvt = null; $('#btnInstall').classList.remove('on');
};
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

applyLang();
show(db.current && db.players[db.current] ? 'home' : 'profiles');
</script>
</body>
</html>
